<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- خلفية داكنة أنيقة -->
  <rect width="100" height="100" rx="20" fill="#0F172A"/>

  <!-- دوائر الرادار (Radar Rings) -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.35"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>

  <!-- رسم كلمة BEFIT بالخط والمسافات الأصلية لشعار BeFit 360 -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="square" fill="none">
    <!-- B -->
    <path d="M 8 32 H 18 C 23 32, 23 41, 17 41 H 8 V 52 H 18 C 24 52, 24 41, 17 41" />
    <line x1="8" y1="32" x2="8" y2="52" />

    <!-- E (أفقية منفصلة) -->
    <line x1="23" y1="32" x2="33" y2="32" />
    <line x1="23" y1="41" x2="31" y2="41" />
    <line x1="23" y1="52" x2="33" y2="52" />

    <!-- F -->
    <path d="M 43 32 H 37 L 35 52" />
    <line x1="37" y1="41" x2="42" y2="41" />

    <!-- I -->
    <line x1="48" y1="32" x2="45" y2="52" />

    <!-- T -->
    <line x1="51" y1="32" x2="62" y2="32" />
    <line x1="57" y1="32" x2="54" y2="52" />
  </g>

  <!-- رسم رقم 30 الخاص باللوجو باللون البرتقالي (#F59E0B) -->
  <g stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- 3 -->
    <path d="M 68 32 H 78 L 72 41 C 77 41, 79 46, 77 50 C 75 54, 70 53, 67 51" />
    <!-- Circle 0 -->
    <circle cx="88" cy="42" r="6" stroke-width="2.5" />
    <line x1="83" y1="52" x2="93" y2="52" stroke-width="2.5" />
  </g>

  <!-- خط نبض القلب الرياضي باللون البرتقالي أسفل اللوجو -->
  <path d="M 8 72 H 24 L 30 58 L 36 84 L 44 42 L 50 90 L 56 60 L 61 72 H 92" 
        fill="none" 
        stroke="#F59E0B" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <circle cx="92" cy="72" r="2.5" fill="#F59E0B"/>
</svg>
